---
- name: Bootstrap WSL environment
  hosts: wsl
  roles:
    - role: bootstrap
      vars:
        bootstrap_ansible: false
#   - role: local.setup.base

- name: Aprovisionamiento Inicial de Servidores
  hosts: servers
  # Se ejecuta inicialmente con el usuario interactivo del sistema (ej. rgm o pi)
  roles:
    - role: robertdebock.bootstrap
    - role: bootstrap
