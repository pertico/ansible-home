[defaults]
# Ruta al inventario por defecto
inventory = ./inventory/hosts.yml

roles_path = ./roles

# Ruta para resolver la colección local sin publicar
collections_path = ./collections

# Intérprete de Python por defecto
interpreter_python = auto_silent

# Formato visualmente limpio para ejecuciones SSH
#stdout_callback = yaml
callbacks_enabled = timer

[ssh_connection]
# Optimizaciones de SSH para acelerar la ejecución en la Pi y d270
pipelining = True
control_path = %(directory)s/ansible-ssh-%%h-%%p-%%r
