---
- name: Instalar el repositorio de Puppet directamente desde la URL
  ansible.builtin.apt:
    deb: "{{ bootstrap_puppet_repo_urls[bootstrap_puppet_repo_provider] }}"
    state: present
  when: not bootstrap_puppet_use_os_packages

- name: Actualizar la caché de apt tras añadir el repositorio
  ansible.builtin.apt:
    update_cache: true
  when: not bootstrap_puppet_use_os_packages

- name: Instalar el paquete del agente de Puppet
  ansible.builtin.apt:
    name: "{{ bootstrap_puppet_agent_package[bootstrap_puppet_repo_provider] }}"
    state: present

- name: Instalar r10k en caso de despliegue de puppet server o masterless
  ansible.builtin.apt:
    name: "{{ bootstrap_r10k_package }}"
    state: present
  when: bootstrap_puppet_server or bootstrap_puppet_masterless
